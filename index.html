<style>
  :root{
    --morado-100:#F6F1E6; --morado-200:#EDE4FC; --morado-300:#E4D8FA; --morado-400:#D6C6F7;
    --morado-500:#C6B2F2; --morado-600:#B49AEB; --morado-700:#7C5CD6; --morado-800:#5B3E96;
    --texto:#3B2A63; --texto-suave:#6B5B8F; --texto-tenue:#9B8CC0; --linea:#F2ECFC; --linea2:#F4EFFC;
    --borde:#EADFFB; --fondo:#FBF9FE; --verde:#9FD8BE; --verde-suave:#E4F3EC; --rosa:#E39BB8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--fondo);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--texto);}
  input,select,button{font-family:inherit;}
  input:focus,select:focus{outline:2px solid var(--morado-600);outline-offset:-2px;border-radius:4px;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .wrap{padding:max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));max-width:1120px;margin:0 auto;}
  .banner{background:linear-gradient(180deg,var(--morado-400) 0%,var(--morado-500) 100%);border-radius:20px;padding:26px 32px;display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .banner h1{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:600;font-size:44px;line-height:1;margin:0;letter-spacing:.5px;}
  .banner .right{display:flex;align-items:center;gap:14px;}
  .tag{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--morado-800);font-weight:500;}
  select.moneda{border:1px solid var(--morado-700);background:#fff;color:var(--morado-800);font-weight:700;border-radius:8px;padding:6px 8px;cursor:pointer;}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:18px;}
  .card{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:22px 24px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea);}
  .row:last-of-type{border-bottom:none;}
  .row .label{display:flex;align-items:center;gap:9px;font-size:15px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .valor{font-size:17px;font-weight:700;}
  #ingresos{width:120px;text-align:right;font-size:17px;font-weight:700;color:var(--morado-800);border:1px solid var(--morado-300);background:#FAF7FF;border-radius:8px;padding:6px 10px;}
  .totales .box{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;margin-top:14px;border-radius:10px;}
  .totales .gastado{background:var(--morado-100);}
  .totales .queda{background:var(--morado-200);margin-top:8px;}
  .totales .box span:first-child{font-size:14px;font-weight:700;letter-spacing:.3px;}
  .totales .box span:last-child{font-size:20px;font-weight:700;}
  .totales .queda span:last-child{color:var(--morado-800);}
  .donutcard{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
  .donut-holder{position:relative;width:190px;height:190px;flex:0 0 auto;}
  .donut{position:absolute;inset:0;border-radius:50%;}
  .donut-center{position:absolute;inset:30px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .donut-center .k{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--texto-tenue);}
  .donut-center .v{font-family:Georgia,serif;font-size:32px;font-weight:600;line-height:1;}
  .donut-center .p{font-size:12px;color:var(--texto-tenue);}
  .leyenda{display:flex;flex-direction:column;gap:12px;min-width:150px;flex:1;}
  .leyenda .it{display:flex;align-items:center;gap:10px;}
  .leyenda .it .nombre{font-size:14px;flex:1;}
  .leyenda .it .val{font-size:14px;font-weight:700;}
  .tabla-wrap{background:#fff;border:1px solid var(--borde);border-radius:18px;margin-top:18px;overflow-x:auto;}
  .tabla{min-width:720px;}
  .trow{display:grid;grid-template-columns:40px minmax(0,1.5fr) 160px 120px 120px minmax(0,1fr) 34px;align-items:center;gap:10px;padding:4px 18px;border-bottom:1px solid var(--linea2);}
  .thead{padding:12px 18px;background:var(--morado-400);font-size:13px;font-weight:700;letter-spacing:.4px;border-bottom:none;}
  .tfoot{padding:14px 18px;background:var(--morado-200);font-weight:700;font-size:15px;border-bottom:none;}
  .tright{text-align:right;}
  .chk{width:17px;height:17px;accent-color:var(--morado-700);cursor:pointer;margin:0;}
  .tipo-input{width:100%;border:1px solid transparent;background:transparent;font-size:15px;padding:8px 6px;color:var(--texto);}
  .cat-select{width:100%;border:1px solid var(--morado-300);border-radius:7px;padding:6px 8px;font-size:13px;cursor:pointer;color:var(--texto);}
  .num-input{width:100%;text-align:right;border:1px solid transparent;background:transparent;font-size:15px;padding:8px 6px;}
  .num-input.actual{font-weight:700;color:var(--texto);}
  .num-input.presu{color:var(--texto-suave);}
  .barra-pad{padding-left:8px;}
  .barra-bg{display:block;height:8px;border-radius:99px;background:#F1EAFB;overflow:hidden;}
  .barra-fg{display:block;height:100%;border-radius:99px;}
  .del-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--borde);background:#fff;color:#A796CC;font-size:15px;line-height:1;cursor:pointer;}
  .del-btn:hover{background:#F6EFFF;color:var(--morado-700);}
  .acciones{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}
  .btn-add{border:none;background:var(--morado-700);color:#fff;font-size:14px;font-weight:700;padding:11px 20px;border-radius:10px;cursor:pointer;}
  .btn-add:hover{background:#6A4AC4;}
  .btn-reset{border:1px solid var(--morado-300);background:#fff;color:var(--texto-suave);font-size:14px;font-weight:500;padding:11px 18px;border-radius:10px;cursor:pointer;}
  .btn-reset:hover{background:#F8F4FF;}
  .nota{font-size:13px;color:var(--texto-tenue);margin-left:auto;}
</style>
</head>
<body>
<div class="wrap">

  <div class="banner">
    <h1>Control de gastos</h1>
    <div class="right">
      <span class="tag">plantilla mensual</span>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="row">
        <span style="font-size:15px;font-weight:500;">Ingresos</span>
        <input type="number" id="ingresos" />
      </div>
      <div class="row"><span class="label"><span class="dot" style="background:#7C5CD6"></span>Gastos fijos</span><span class="valor" id="v-fijos"></span></div>
      <div class="row"><span class="label"><span class="dot" style="background:#B49AEB"></span>Ocio</span><span class="valor" id="v-ocio"></span></div>
      <div class="row"><span class="label"><span class="dot" style="background:#9FD8BE"></span>Ahorro</span><span class="valor" id="v-ahorro"></span></div>
      <div class="totales">
        <div class="box gastado"><span>Total gastado</span><span id="v-total"></span></div>
        <div class="box queda"><span>Queda por gastar</span><span id="v-queda"></span></div>
      </div>
    </div>

    <div class="card donutcard">
      <div class="donut-holder">
        <div class="donut" id="donut"></div>
        <div class="donut-center">
          <span class="k">gastado</span>
          <span class="v" id="v-total2"></span>
          <span class="p" id="v-pct"></span>
        </div>
      </div>
      <div class="leyenda" id="leyenda"></div>
    </div>
  </div>

  <div class="tabla-wrap">
    <div class="tabla">
      <div class="trow thead">
        <span></span><span>Tipo</span><span>Categoría</span>
        <span class="tright">Presupuesto</span><span class="tright">Actual</span>
        <span class="barra-pad">Progreso</span><span></span>
      </div>
      <div id="filas"></div>
      <div class="trow tfoot">
        <span></span><span>Total</span><span></span>
        <span class="tright" id="v-totalpresu"></span>
        <span class="tright" id="v-total3"></span>
        <span></span><span></span>
      </div>
    </div>
  </div>

  <div class="acciones">
    <button class="btn-add" id="btn-add">+ Añadir fila</button>
    <button class="btn-reset" id="btn-reset">Restablecer plantilla</button>
    <span class="nota">Todo se guarda automáticamente en este dispositivo.</span>
  </div>

</div>

<script>
(function(){
  const BASE = [
    ["Casa","Gasto fijo",460,450,true],
    ["Comida","Gasto fijo",240,215,true],
    ["Transporte","Gasto fijo",80,80,true],
    ["Agua","Gasto fijo",25,19,true],
    ["Luz","Gasto fijo",50,49,true],
    ["Gas","Gasto fijo",20,23,true],
    ["Seguro","Gasto fijo",20,20,false],
    ["Móvil","Gasto fijo",15,15,false],
    ["Internet","Gasto fijo",20,20,false],
    ["Salidas","Ocio",100,110,false],
    ["Ropa","Ocio",50,40,false],
    ["Escapadas","Ocio",50,50,false],
    ["Pilates","Ocio",50,50,false],
    ["Belleza","Ocio",30,30,false],
    ["Ahorro mensual","Ahorro",300,300,false]
  ];
  const KEY = "cg-morado-v1";
  const CAT_COLOR = { "Gasto fijo":"#7C5CD6", "Ocio":"#B49AEB", "Ahorro":"#9FD8BE" };

  function defaultState(){
    return {
      ingresos: 1500,
      filas: BASE.map((r,i)=>({ id:i+1, tipo:r[0], cat:r[1], presu:r[2], actual:r[3], pagado:r[4] }))
    };
  }

  let state = defaultState();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.filas)) {
        state = { ingresos: d.ingresos ?? 1500, filas: d.filas };
      }
    }
  } catch(e){}

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
    render();
  }

  function money(n){
    const s = Math.round(n).toLocaleString("es-ES");
    return "$" + s;
  }

  function render(){
    const filas = state.filas;
    const ingresos = Number(state.ingresos) || 0;
    const sum = c => filas.filter(f=>f.cat===c).reduce((a,f)=>a+(Number(f.actual)||0),0);
    const fijos = sum("Gasto fijo"), ocio = sum("Ocio"), ahorro = sum("Ahorro");
    const total = fijos + ocio + ahorro;
    const queda = ingresos - total;
    const totalPresu = filas.reduce((a,f)=>a+(Number(f.presu)||0),0);
    const maxRow = Math.max(1, ...filas.map(f=>Math.max(Number(f.actual)||0, Number(f.presu)||0)));

    document.getElementById("ingresos").value = state.ingresos;
    document.getElementById("v-fijos").textContent = money(fijos);
    document.getElementById("v-ocio").textContent = money(ocio);
    document.getElementById("v-ahorro").textContent = money(ahorro);
    document.getElementById("v-total").textContent = money(total);
    document.getElementById("v-total2").textContent = money(total);
    document.getElementById("v-total3").textContent = money(total);
    document.getElementById("v-queda").textContent = money(queda);
    document.getElementById("v-totalpresu").textContent = money(totalPresu);
    document.getElementById("v-pct").textContent = (ingresos ? Math.round((total/ingresos)*100) : 0) + "% de ingresos";

    const base = Math.max(ingresos, total) || 1;
    const parts = [[fijos,"#7C5CD6"],[ocio,"#B49AEB"],[ahorro,"#9FD8BE"],[Math.max(queda,0),"#EDE4FC"]];
    let acc = 0;
    const stops = parts.map(([v,c])=>{
      const from = (acc/base)*100; acc += v;
      return c + " " + from.toFixed(2) + "% " + ((acc/base)*100).toFixed(2) + "%";
    });
    document.getElementById("donut").style.background = "conic-gradient(" + stops.join(", ") + ")";

    const leyendaEl = document.getElementById("leyenda");
    leyendaEl.innerHTML = "";
    [
      {nombre:"Gastos fijos",color:"#7C5CD6",valor:money(fijos)},
      {nombre:"Ocio",color:"#B49AEB",valor:money(ocio)},
      {nombre:"Ahorro",color:"#9FD8BE",valor:money(ahorro)},
      {nombre:"Disponible",color:"#EDE4FC",valor:money(Math.max(queda,0))}
    ].forEach(l=>{
      const div = document.createElement("div");
      div.className = "it";
      div.innerHTML = `<span class="dot" style="width:12px;height:12px;background:${l.color}"></span><span class="nombre">${l.nombre}</span><span class="val">${l.valor}</span>`;
      leyendaEl.appendChild(div);
    });

    const filasEl = document.getElementById("filas");
    filasEl.innerHTML = "";
    filas.forEach(f=>{
      const over = (Number(f.actual)||0) > (Number(f.presu)||0);
      const barColor = over ? "#E39BB8" : (CAT_COLOR[f.cat] || "#7C5CD6");
      const barW = Math.min(100, ((Number(f.actual)||0)/maxRow)*100).toFixed(1) + "%";
      const row = document.createElement("div");
      row.className = "trow";
      row.innerHTML = `
        <input type="checkbox" class="chk" ${f.pagado ? "checked" : ""}>
        <input type="text" class="tipo-input" placeholder="Concepto" value="${f.tipo.replace(/"/g,'&quot;')}" style="text-decoration:${f.pagado ? "line-through" : "none"}">
        <select class="cat-select" style="background:${f.cat === "Gasto fijo" ? "#EDE4FC" : f.cat === "Ocio" ? "#F3E9FF" : "#E4F3EC"}">
          <option value="Gasto fijo" ${f.cat==="Gasto fijo"?"selected":""}>Gasto fijo</option>
          <option value="Ocio" ${f.cat==="Ocio"?"selected":""}>Ocio</option>
          <option value="Ahorro" ${f.cat==="Ahorro"?"selected":""}>Ahorro</option>
        </select>
        <input type="number" class="num-input presu" value="${f.presu}">
        <input type="number" class="num-input actual" value="${f.actual}">
        <span class="barra-pad"><span class="barra-bg"><span class="barra-fg" style="width:${barW};background:${barColor}"></span></span></span>
        <button class="del-btn" title="Eliminar fila">×</button>
      `;
      const [chk, tipoInput, catSelect, presuInput, actualInput, , delBtn] = row.children;
      chk.addEventListener("change", e => { f.pagado = e.target.checked; save(); });
      tipoInput.addEventListener("change", e => { f.tipo = e.target.value; save(); });
      catSelect.addEventListener("change", e => { f.cat = e.target.value; save(); });
      presuInput.addEventListener("change", e => { f.presu = Number(e.target.value)||0; save(); });
      actualInput.addEventListener("change", e => { f.actual = Number(e.target.value)||0; save(); });
      delBtn.addEventListener("click", () => { state.filas = state.filas.filter(x=>x.id!==f.id); save(); });
      filasEl.appendChild(row);
    });
  }

  document.getElementById("ingresos").addEventListener("change", e => { state.ingresos = Number(e.target.value)||0; save(); });
  document.getElementById("btn-add").addEventListener("click", () => {
    state.filas.push({ id: Date.now(), tipo:"", cat:"Gasto fijo", presu:0, actual:0, pagado:false });
    save();
  });
  document.getElementById("btn-reset").addEventListener("click", () => {
    if (confirm("¿Restablecer la plantilla a sus valores por defecto? Se perderán los cambios.")) {
      state = defaultState();
      save();
    }
  });

  render();
})();
</script>
</body>
</html>
